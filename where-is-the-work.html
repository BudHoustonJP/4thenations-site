  /* ---------- flow ---------- */
  function nextStep(id, ans) {
    const xi = ACC_IDS.indexOf(id);
    if (xi > -1) return xi < ACC_IDS.length - 1 ? ACC_IDS[xi + 1] : "result";
    if (id === "A") return ans === "no" ? "F1" : "1";
    if (id === "1") return ans === "yes" ? "2" : ans === "no" ? "1b" : "F1";
    if (id === "1b") return "F1";
    if (/^[2-6]$/.test(id)) return ans === "yes" ? String(Number(id) + 1) : "F1";
    if (id === "7") return "F1";
    const i = FN_IDS.indexOf(id);
    if (i > -1) return i < FN_IDS.length - 1 ? FN_IDS[i + 1] : "result";
    return "result";
  }

  function computePhase(a) {
    if (a.A === "no") return { key: "0R", old: true };
    const oldUnsure = a.A === "notsure";
    if (a["1"] === "notsure") return { key: "unknown", oldUnsure: oldUnsure };
    if (a["1"] === "no") return { key: a["1b"] === "yes" ? "0R" : "0", oldUnsure: oldUnsure };
    let p = 1, unsureAt = null;
    for (let n = 2; n <= 7; n++) {
      const v = a[String(n)];
      if (v === "yes") { p = n; continue; }
      if (v === "notsure") unsureAt = n;
      break;
    }
    return { key: String(p), unsureAt: unsureAt, oldUnsure: oldUnsure };
  }

  function computeFunctions(a) {
    const on = FN_IDS.map(function (id) { return a[id] === "yes"; });
    let main = -1;
    on.forEach(function (v, i) { if (v) main = i; });
    /* Faithfulness check: leaders should practice what they train.
       strong = not sharing the good news, yet claims a higher part.
       soft   = shares, but trains or coordinates without having seen a church gather. */
    let flag = null;
    if (!on[0] && main > 0) flag = "strong";
    else if (on[0] && !on[1] && main > 1) flag = "soft";
    return { on: on, main: main, flag: flag };
  }

  function fitMessage(phaseKey, fn) {
    const f = T.fit;
    if (phaseKey === "unknown") return f.unknown;
    const needI = NEED[phaseKey];
    const need = T.functions[needI].name;
    const m = fn.main;
    if (m < 0) return fill(f.none, { need: need });
    if (fn.flag === "strong") return fill(f.flagged, { need: need });
    if (phaseKey === "0" || phaseKey === "0R") return m === 0 ? f.zeroMatch : f.zeroAbove;
    if (m === needI) return fill(f.match, { need: need });
    if (m < needI) return fill(f.below, { need: need, main: T.functions[m].name, threshold: T.functions[m].threshold });
    return fill(fn.flag === "soft" ? f.softAbove : f.above, { need: need });
  }

  /* One merged plan built from the phase and the worker's part. */
  function buildPlan() {
    const u = T.ui;
    const ph = computePhase(state.answers);
    const fn = computeFunctions(state.answers);
    const P = T.phases[ph.key];
    const F = fn.main >= 0 ? T.functions[fn.main] : T.noFunction;
    const who = state.people && state.place ? fill(u.forPeoplePlace, { people: state.people, place: state.place })
              : (state.people || state.place || "");
    const badge = ph.key === "unknown" ? P.label : fill(u.phaseLabel, { n: P.label });
    const notes = [];
    if (ph.old) notes.push(u.oldNewsReason);
    if (ph.oldUnsure) notes.push(u.oldUnsureNote);
    if (ph.unsureAt) {
      const qq = T.phaseQs[String(ph.unsureAt)];
      notes.push(fill(u.unsureNote, { q: qq.q + (qq.list ? " " + qq.list.join(" / ") : ""), n: ph.unsureAt }));
    }
    const doWork = P.do.slice(0, 3);
    const doYou = F.steps.slice(0, 2);
    const flag = fn.flag ? { kind: fn.flag,
      title: fn.flag === "strong" ? u.flagTitle : u.softTitle,
      text: fn.flag === "strong" ? u.flagText : u.softText,
      step: fn.flag === "strong" ? u.flagStep : u.softStep } : null;
    const gaps = T.functions.filter(function (f, i) { return !fn.on[i]; }).map(function (f) { return f.name; });
    return { ph: ph, fn: fn, P: P, F: F, who: who, badge: badge, notes: notes, doWork: doWork, doYou: doYou, flag: flag,
             fit: fitMessage(ph.key, fn), gaps: gaps,
             grow: fn.main >= 0 ? F.threshold : "", watch: fn.main >= 0 ? F.watch : "" };
  }

  /* Phase gauge, redrawn from the toolkit illustration. */
  function gaugeSvg(key) {
    const W = 760, H = 330, cx = 380, cy = 300;
    const RINGS = [[40, 72], [76, 108], [112, 144], [148, 180], [184, 216]];
    const cur = key === "unknown" ? -1 : key === "0R" ? 0 : Number(key);
    function pt(r, a) { const t = a * Math.PI / 180; return (cx + r * Math.cos(t)).toFixed(1) + " " + (cy - r * Math.sin(t)).toFixed(1); }
    function xy(r, a) { const t = a * Math.PI / 180; return [cx + r * Math.cos(t), cy - r * Math.sin(t)]; }
    function sector(r1, r2, a1, a2) {
      return "M" + pt(r2, a1) + " A" + r2 + " " + r2 + " 0 0 1 " + pt(r2, a2) + " L" + pt(r1, a2) + " A" + r1 + " " + r1 + " 0 0 0 " + pt(r1, a1) + " Z";
    }
    function wrap(name) {
      const words = name.toLocaleUpperCase(lang).split(/\s+/), lines = [];
      let line = "";
      words.forEach(function (w) { if (line && (line + " " + w).length > 16) { lines.push(line); line = w; } else { line = line ? line + " " + w : w; } });
      if (line) lines.push(line);
      return lines;
    }
    const narrow = window.innerWidth < 560;  /* phones: names hidden, crop the side margins */
    let svg = '<svg class="gauge" viewBox="' + (narrow ? "112 26 536 290" : "0 0 " + W + " " + H) + '" role="img" aria-label="' + esc(T.ui.gaugeLabel) + '">';
    for (let k = 0; k < 8; k++) {
      const a1 = 180 - k * 22.5, a2 = a1 - 22.5, mid = a1 - 11.25;
      const op = cur < 0 ? 0.45 : k <= cur ? 1 : 0.28;
      svg += '<g opacity="' + op + '">';
      if (k === 0) svg += '<path d="' + sector(40, 226, a1, a2) + '" fill="' + GAUGE[0][0] + '" stroke="#fffdf8" stroke-width="3"/>';
      else RINGS.forEach(function (r, j) { svg += '<path d="' + sector(r[0], r[1], a1, a2) + '" fill="' + GAUGE[k][j] + '" stroke="#fffdf8" stroke-width="3"/>'; });
      const col = k === 0 ? GAUGE[0][0] : GAUGE[k][4];
      const p = xy(238, mid);
      const anchor = mid > 95 ? "end" : mid < 85 ? "start" : "middle";
      const up = k >= 2 && k <= 5;
      const label = (k === 0 && key === "0R") ? "0-R" : String(k);
      const lines = wrap(T.phases[String(k)].name);
      svg += '<text x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" text-anchor="' + anchor + '" class="gnum" fill="' + col + '">' + label + "</text>";
      lines.forEach(function (ln, i) {
        const dy = up ? -(26 + (lines.length - 1 - i) * 15) : (16 + i * 15);
        svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + dy).toFixed(1) + '" text-anchor="' + anchor + '" class="gname">' + esc(ln) + "</text>";
      });
      svg += "</g>";
    }
    if (cur >= 0) {
      const a1 = 180 - cur * 22.5, a2 = a1 - 22.5, mid = a1 - 11.25;
      svg += '<path d="' + sector(40, cur === 0 ? 226 : 216, a1, a2) + '" fill="none" stroke="#1C1A17" stroke-width="3.5" stroke-linejoin="round"/>';
      const tip = xy(150, mid);
      svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + tip[0].toFixed(1) + '" y2="' + tip[1].toFixed(1) + '" stroke="#1C1A17" stroke-width="7" stroke-linecap="round"/>';
    }
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="13" fill="#1C1A17"/>';
    svg += "</svg>";
    return svg;
  }

  function viewAcc(pl) {
    const A = T.acc, U = A.ui, Q = A.byPhase[pl.ph.key];
    const sel = accSelect();
    const rName = { strong: U.strong, growing: U.growing, weak: U.weak, notsure: U.notSure };
    function accBlock(k) {
      const a = A.list[k];
      return '<div class="accel"><h4>' + esc(a.name) + (a.toolkit && a.toolkit !== a.name ? ' <span class="tk">' + esc(a.toolkit) + "</span>" : "") + "</h4>" +
        '<p class="bigq"><b>' + esc(U.big) + ":</b> " + esc(a.big) + "</p>" +
        "<ul>" + li(Q[k]) + "</ul></div>";
    }
    function areaBlock(i, open) {
      const a = A.areas[i], r = state.answers[ACC_IDS[i]] || "";
      const badge = '<span class="said ' + r + '">' + esc(fill(U.said, { r: rName[r] || "" })) + "</span>";
      const inner = a.keys.map(accBlock).join("");
      return open ? '<div class="area"><div class="area-head"><h3>' + esc(a.name) + "</h3>" + badge + "</div>" + inner + "</div>"
                  : '<details class="area"><summary><span class="area-name">' + esc(a.name) + "</span>" + badge + "</summary>" + inner + "</details>";
    }
    const order = [];
    sel.pick.concat(sel.rest).forEach(function (i) { A.areas[i].keys.forEach(function (k) { order.push(k); }); });
    if (!state.plan.acc) state.plan.acc = order[0];
    let html = '<div class="card" id="wiw-acc"><div class="part">' + esc(U.part) + "</div>" +
      "<h2>" + esc(fill(U.title, { n: pl.P.label, name: pl.P.name })) + "</h2>" +
      '<p class="lead" style="font-size:17px">' + esc(sel.pick.length ? U.lead : U.allStrong) + "</p>" +
      sel.pick.map(function (i) { return areaBlock(i, true); }).join("");
    if (sel.rest.length) html += '<h3 class="more">' + esc(U.more) + "</h3>" + sel.rest.map(function (i) { return areaBlock(i, false); }).join("");
    html += '<div class="plan"><h3>' + esc(U.planTitle) + '</h3><p class="small">' + esc(U.planLead) + "</p>" +
      '<label for="wiw-plan-acc">' + esc(U.planAcc) + '</label><select id="wiw-plan-acc">' +
        order.map(function (k) { return '<option value="' + k + '"' + (k === state.plan.acc ? " selected" : "") + ">" + esc(A.list[k].name) + "</option>"; }).join("") +
      "</select>" +
      '<label for="wiw-plan-action">' + esc(U.planAction) + '</label><textarea id="wiw-plan-action" rows="2">' + esc(state.plan.action) + "</textarea>" +
      '<div class="row"><div><label for="wiw-plan-who">' + esc(U.planWho) + '</label><input type="text" id="wiw-plan-who" value="' + esc(state.plan.who) + '"></div>' +
      '<div><label for="wiw-plan-when">' + esc(U.planWhen) + '</label><input type="date" id="wiw-plan-when" value="' + esc(state.plan.when) + '"></div></div>' +
      "</div>" +
      '<p class="small" style="margin-top:14px">' + esc(U.note) + "</p>" +
      '<div class="actions noprint"><button class="btn btn-ghost" id="wiw-acc-redo">' + esc(U.redo) + "</button></div></div>";
    return html;
  }

  function planText() {
    const U = T.acc.ui, pln = state.plan;
    if (!pln.action) return "";
    return fill(U.planLine, { acc: T.acc.list[pln.acc] ? T.acc.list[pln.acc].name : "", action: pln.action,
                              who: pln.who || T.ui.notGiven, when: pln.when || T.ui.notGiven });
  }

  function coachHref(pl) {
    const u = T.ui;
    const to = LINKS.coachUser + "@" + LINKS.coachDomain;
    const fnName = pl.fn.main >= 0 ? pl.F.name : T.noFunction.name;
    const subject = fill(u.mailSubject, { phase: pl.badge + " " + pl.P.name, fn: fnName });
    const body = [
      u.mailIntro, "",
      u.mailName + " ", u.mailContact + " ", "",
      u.mailPeople + " " + (pl.who || u.notGiven),
      u.mailPhase + " " + pl.badge + ", " + pl.P.name,
      u.mailFn + " " + fnName,
      u.mailFit + " " + pl.fit
    ].concat(pl.flag ? [u.mailFlag + " " + pl.flag.title] : [])
     .concat(state.accDone && accAllowed(pl.ph.key) ? [T.acc.ui.mailAcc + " " + (accFocusNames().join(", ") || "-")] : [])
     .concat(planText() ? [T.acc.ui.mailPlan + " " + planText()] : []).join("\n");
    return "mailto:" + to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  function viewResult() {
    const u = T.ui;
    const pl = buildPlan();
    const P = pl.P, F = pl.F;

    /* Card 1: where the work is + your part */
    let html = langPicker() +
      '<div class="card">' +
      '<div class="part">' + esc(u.resultsTitle) + (pl.who ? ": " + esc(pl.who) : "") + "</div>" +
      gaugeSvg(pl.ph.key) +
      '<p class="small gauge-cap">' + esc(u.gaugeCaption) + "</p>" +
      '<div class="summary">' +
        "<div>" +
          '<p class="label">' + esc(u.phaseHeading) + "</p>" +

          '<div class="big"><small>' + esc(pl.badge) + "</small>" + esc(P.name) + "</div>" +
          "<p>" + esc(P.meaning) + "</p>" +
          '<div class="picture"><b>' + esc(P.ref) + ".</b> " + esc(P.picture) + "</div>" +
        "</div>" +
        "<div>" +
          '<p class="label">' + esc(u.fnHeading) + "</p>" +
          '<div class="fns">' + T.functions.map(function (f, i) {
            let cls = i === pl.fn.main ? "fn on main" : pl.fn.on[i] ? "fn on" : "fn";
            if (pl.flag && ((pl.flag.kind === "strong" && i === 0) || (pl.flag.kind === "soft" && i === 1))) cls = "fn flagged";
            return '<div class="' + cls + '">' + ICONS[i] + "<span>" + esc(f.name) + "</span></div>";
          }).join("") + "</div>" +
          '<div class="big" style="font-size:24px"><small>' + esc(u.mainFn) + "</small>" + esc(F.name) + "</div>" +
          '<div class="picture"><b>' + esc(F.ref) + ".</b> " + esc(F.picture) + "</div>" +
          (pl.flag ? '<div class="flag ' + pl.flag.kind + '"><b>' + esc(pl.flag.title) + "</b><p>" + esc(pl.flag.text) + "</p></div>" : "") +
        "</div>" +
      "</div>" +
      pl.notes.map(function (n) { return '<div class="note">' + esc(n) + "</div>"; }).join("") +
      "</div>";

    /* Card 2: one merged plan */
    html += '<div class="card"><h2>' + esc(u.planTitle) + "</h2>" +
      '<p class="fit">' + esc(pl.fit) + "</p>" +
      '<div class="grid2">' +
        '<div class="box"><p class="label">' + esc(u.focus) + "</p><p>" + esc(P.holding) + "</p></div>" +
        '<div class="box"><p class="label">' + esc(u.next) + "</p><p>" + esc(P.next) + "</p></div>" +
      "</div>" +
      "<h3>" + esc(u.pray) + "</h3><p>" + esc(P.pray) + "</p>" +
      "<h3>" + esc(pl.flag ? u.doStepsFlag : u.doSteps) + '</h3><ol class="do">' +
        (pl.flag ? '<li><span class="tag start">' + esc(u.startTag) + "</span>" + esc(pl.flag.step) + "</li>" : "") +
        pl.doWork.map(function (d) { return '<li><span class="tag work">' + esc(u.tagWork) + "</span>" + esc(d) + "</li>"; }).join("") +
        pl.doYou.map(function (d) { return '<li><span class="tag you">' + esc(u.tagYou) + "</span>" + esc(d) + "</li>"; }).join("") +
      "</ol>";
    if (pl.grow || pl.watch) {
      html += "<h3>" + esc(u.grow) + "</h3>";
      if (pl.grow) html += "<p>" + esc(pl.grow) + "</p>";
      if (pl.watch) html += '<p class="small">' + esc(u.watch) + ": " + esc(pl.watch) + "</p>";
    }
    html += "<h3>" + esc(u.ask) + '</h3><p class="quote">' + esc(P.ask) + "</p>";
    if (pl.gaps.length && pl.fn.main >= 0) {
      html += "<p>" + esc(u.gapsTitle) + ": " + esc(pl.gaps.join(", ")) + ". " + esc(u.gapsAsk) + "</p>";
      if (!pl.fn.on[4]) html += "<p>" + esc(u.scGap) + "</p>";
    }
    html += "<h3>" + esc(u.useTitle) + '</h3><p class="small">' + esc(u.useBody) + "</p>";
    if (accAllowed(pl.ph.key)) {
      const AU = T.acc.ui;
      html += '<div class="final-step"><h3>' + esc(AU.stepTitle) + "</h3><p>" + esc(AU.stepText) + "</p>" +
        (state.accDone ? '<a class="btn btn-ghost noprint" href="#wiw-acc">' + esc(AU.seeBelow) + " &darr;</a>"
                       : '<button class="btn btn-primary noprint" id="wiw-acc-start">' + esc(AU.start) + "</button>") +
        "</div>";
    }
    html += "</div>";
    if (state.accDone && accAllowed(pl.ph.key)) html += viewAcc(pl);

    /* Card 3: report and coaching */
    html += '<div class="card cta-card"><h2>' + esc(u.ctaTitle) + "</h2>" +
      '<div class="cta">' +
        '<div class="box"><p>' + esc(u.reportText) + "</p>" +
          '<a class="btn btn-red" id="wiw-report" href="' + esc(LINKS.report) + '" target="_blank" rel="noopener">' + esc(u.reportBtn) + "</a></div>" +
        '<div class="box"><p>' + esc(u.coachText) + "</p>" +
          '<a class="btn btn-primary" id="wiw-coach" href="' + esc(coachHref(pl)) + '">' + esc(u.coachBtn) + "</a></div>" +
      "</div>" +
      '<div class="actions">' +
        '<button class="btn btn-ghost" id="wiw-print">' + esc(u.print) + "</button>" +
        '<button class="btn btn-ghost" id="wiw-copy">' + esc(u.copy) + "</button>" +
        '<button class="btn btn-ghost" id="wiw-again">' + esc(u.again) + "</button>" +
      "</div></div>";
    return html;
  }

  function resultText() {
    const u = T.ui, pl = buildPlan();
    const L = [];
    L.push(u.title + (pl.who ? ": " + pl.who : ""));
    L.push("");
    L.push(pl.badge + ": " + pl.P.name + ". " + pl.P.meaning);
    L.push(u.mainFn + ": " + pl.F.name);
    L.push("");
    L.push(pl.fit);
    L.push(u.focus + ": " + pl.P.holding);
    L.push(u.next + ": " + pl.P.next);
    L.push(u.pray + ": " + pl.P.pray);
    if (pl.flag) L.push(pl.flag.title + ": " + pl.flag.text);
    L.push(u.doSteps + ":");
    (pl.flag ? [pl.flag.step] : []).concat(pl.doWork, pl.doYou).forEach(function (d, i) { L.push("  " + (i + 1) + ". " + d); });
    if (pl.grow) L.push(u.grow + ": " + pl.grow);
    L.push(u.ask + ": " + pl.P.ask);
    pl.notes.forEach(function (n) { L.push(n); });
    if (state.accDone && accAllowed(pl.ph.key)) {
      L.push("");
      L.push(T.acc.ui.mailAcc + " " + (accFocusNames().join(", ") || "-"));
      if (planText()) L.push(T.acc.ui.mailPlan + " " + planText());
    }
    L.push("");
    L.push(u.reportBtn + ": " + LINKS.report);
    L.push(window.location.href.split("?")[0]);
    return L.join("\n");
  }

  function copyResults(btn) {
    const text = resultText();
    const done = function () { btn.textContent = T.ui.copied; setTimeout(function () { btn.textContent = T.ui.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  }
  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "absolute"; ta.style.left = "-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  function renderFooter() {
    const u = T.ui;
    footer.innerHTML = fill(esc(u.footer), {
      toolkit: '<a href="' + LINKS.toolkit + '" target="_blank" rel="noopener">' + esc(u.toolkitLink) + "</a>",
      functions: '<a href="' + LINKS.functions + '" target="_blank" rel="noopener">' + esc(u.functionsLink) + "</a>"
    }) + ' <a href="' + LINKS.bottleneck + '" target="_blank" rel="noopener">' + esc(u.moreLink) + "</a><br>" + esc(u.gaugeCredit);
  }

  function render(moveFocus) {
    document.documentElement.lang = lang;
    document.documentElement.dir = T.dir || "ltr";
    let html;
    if (state.step === "intro") html = viewIntro();
    else if (state.step === "result") html = viewResult();
    else html = viewQuestion();
    root.innerHTML = html;
    renderFooter();
    bind();
    if (state.scrollTo) {
      const target = document.getElementById(state.scrollTo);
      state.scrollTo = "";
      if (target) { setTimeout(function () { target.scrollIntoView({ behavior: "smooth", block: "start" }); }, 30); return; }
    }
    if (moveFocus) {
      const q = document.getElementById("wiw-q");
      if (q) q.focus({ preventScroll: true });
      const top = root.getBoundingClientRect().top + window.pageYOffset - 70;
      if (window.pageYOffset > top) window.scrollTo({ top: top, behavior: "smooth" });
    }
  }

  function bind() {
    const sel = document.getElementById("wiw-lang");
    if (sel) sel.addEventListener("change", function () { lang = sel.value; T = LANGS[lang]; render(false); });
    const start = document.getElementById("wiw-start");
    if (start) start.addEventListener("click", function () {
      state.people = document.getElementById("wiw-people").value.trim();
      state.place = document.getElementById("wiw-place").value.trim();
      state.answers = {}; state.history = []; state.step = "A";
      render(true);
    });
    root.querySelectorAll(".answer").forEach(function (b) {
      b.addEventListener("click", function () { answer(b.getAttribute("data-a")); });
    });
    const back = document.getElementById("wiw-back");
    if (back) back.addEventListener("click", goBack);
    const pr = document.getElementById("wiw-print");
    if (pr) pr.addEventListener("click", function () { window.print(); });
    const cp = document.getElementById("wiw-copy");
    if (cp) cp.addEventListener("click", function () { copyResults(cp); });
    const ag = document.getElementById("wiw-again");
    if (ag) ag.addEventListener("click", restart);
    const as = document.getElementById("wiw-acc-start");
    if (as) as.addEventListener("click", startAcc);
    const ar = document.getElementById("wiw-acc-redo");
    if (ar) ar.addEventListener("click", startAcc);
    [["wiw-plan-acc", "acc"], ["wiw-plan-action", "action"], ["wiw-plan-who", "who"], ["wiw-plan-when", "when"]].forEach(function (f) {
      const el = document.getElementById(f[0]);
      if (!el) return;
      const upd = function () {
        state.plan[f[1]] = el.value.trim();
        const c = document.getElementById("wiw-coach");
        if (c) c.setAttribute("href", coachHref(buildPlan()));
      };
      el.addEventListener("input", upd); el.addEventListener("change", upd);
    });
  }

  /* Test hook */
  window.WIW = {
    computePhase: computePhase, computeFunctions: computeFunctions,
    fitMessage: function (k, a) { return fitMessage(k, computeFunctions(a)); }, nextStep: nextStep,
    accSelect: function (a) { const keep = state.answers; state.answers = a; const r = accSelect(); state.answers = keep; return r; }
  };

  render(false);
})();
</script>
</body>
</html>
