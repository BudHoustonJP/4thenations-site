<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Laos Mosaic Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky control bar over a two-pane workbench. Census tree (left) is the frame; banks (right) feed it. */
:root{
  --bg:#F2F5F3; --panel:#FFFFFF; --panel-2:#F7F9F8; --ink:#16201D; --muted:#56635E; --faint:#85928D;
  --line:#DCE3E0; --line-strong:#C2CCC8;
  --accent:#0B6B70; --accent-ink:#FFFFFF; --accent-soft:#DCEEEE;
  --red:#B3261E; --red-soft:#FCE9E7; --red-line:#E7A39C;
  --amber:#985A00; --amber-soft:#FBF0D8; --amber-line:#E2BE74;
  --under:#3E5491; --under-soft:#E8ECF7;
  --ok:#2C7849; --ok-soft:#E3F1E8;
  --nat:#B0460E; --nat-soft:#FCEDE1;
  --new:#6A45BF; --new-soft:#EEE8FB;
  --fam-1:#2E6AB0; --fam-2:#3B8956; --fam-3:#8656AE; --fam-4:#A9741F;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 6px 18px rgba(18,32,28,.07);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:150px; --stick:var(--hdr); --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --panel:#151D1A; --panel-2:#1A2420; --ink:#E3EBE7; --muted:#A2B0AA; --faint:#73817B;
  --line:#28342F; --line-strong:#384641;
  --accent:#55B6B9; --accent-ink:#071211; --accent-soft:#163739;
  --red:#FF8B80; --red-soft:#3A1917; --red-line:#7C2F29;
  --amber:#F0B65C; --amber-soft:#382910; --amber-line:#77591F;
  --under:#A2B4EC; --under-soft:#1D2540;
  --ok:#7CCB98; --ok-soft:#142E1E;
  --nat:#FFA56E; --nat-soft:#382114;
  --new:#B69FF6; --new-soft:#261D41;
  --fam-1:#6FA4E6; --fam-2:#70C48E; --fam-3:#B990E0; --fam-4:#D8A957;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --panel:#151D1A; --panel-2:#1A2420; --ink:#E3EBE7; --muted:#A2B0AA; --faint:#73817B;
  --line:#28342F; --line-strong:#384641;
  --accent:#55B6B9; --accent-ink:#071211; --accent-soft:#163739;
  --red:#FF8B80; --red-soft:#3A1917; --red-line:#7C2F29;
  --amber:#F0B65C; --amber-soft:#382910; --amber-line:#77591F;
  --under:#A2B4EC; --under-soft:#1D2540;
  --ok:#7CCB98; --ok-soft:#142E1E;
  --nat:#FFA56E; --nat-soft:#382114;
  --new:#B69FF6; --new-soft:#261D41;
  --fam-1:#6FA4E6; --fam-2:#70C48E; --fam-3:#B990E0; --fam-4:#D8A957;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-size:20px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px;margin:0;min-width:0}
.draft{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:4px;padding:2px 6px}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.sum{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 9px;font-size:12.5px;color:var(--muted)}
.sum b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
button.sum:hover{border-color:var(--line-strong)}
.sum[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.sum.s-red b{color:var(--red)} .sum.s-amber b{color:var(--amber)} .sum.s-under b{color:var(--under)} .sum.s-chg b{color:var(--accent)}
.sum.info{cursor:default;flex-wrap:wrap;column-gap:6px}
.sum.info>span{white-space:normal}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:7px 10px}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);user-select:none;cursor:pointer}
.switch input{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:left .15s}
.switch input:checked{background:var(--accent)} .switch input:checked::after{left:14px}
details.rules{position:relative}
details.rules summary{list-style:none}
details.rules summary::-webkit-details-marker{display:none}
.rules-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:25;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:12px;width:min(320px,calc(100vw - 32px));display:grid;gap:8px;font-size:13px}
.rules-pop label{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center}
.rules-pop input{border:1px solid var(--line-strong);background:var(--panel-2);border-radius:5px;padding:4px 6px;text-align:right}
.rules-pop p{margin:0;color:var(--muted);font-size:12px}
.banner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:7px 10px;font-size:13px}
.banner[hidden]{display:none!important}

/* layout: navigator rail | census mosaic | banks */
.layout{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(300px,390px);gap:16px;align-items:start;margin-top:14px}
.layout.no-rail{grid-template-columns:0 minmax(0,1fr) minmax(300px,390px);column-gap:0}
.layout.no-rail #mosaic{margin-right:16px}
.rail{grid-column:1} #mosaic{grid-column:2;min-width:0;zoom:var(--z)} .banks{grid-column:3}
.banks{position:sticky;top:calc(var(--stick) + 10px);max-height:calc(100vh - var(--stick) - 24px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
@media (max-width:960px){.layout,.layout.no-rail{grid-template-columns:18px minmax(0,1fr)}.layout.no-rail{grid-template-columns:0 minmax(0,1fr)}.banks{grid-column:1/-1;position:static;max-height:none}.layout.no-rail #mosaic{margin-right:0}}
@media (max-width:720px){:root{--stick:0px}.top{position:static}.layout,.layout.no-rail{grid-template-columns:minmax(0,1fr);column-gap:0}.rail{display:none}#mosaic,.banks{grid-column:1}}

/* navigator rail: the whole mosaic in one strip; the box is what is on screen */
.rail{position:sticky;top:calc(var(--stick) + 10px);height:calc(100vh - var(--stick) - 120px);min-height:200px;cursor:pointer;touch-action:none;user-select:none}
.rail-track{position:absolute;inset:0;border-radius:6px;background:var(--panel-2);border:1px solid var(--line)}
.rail .sg{position:absolute;left:4px;right:3px;border-radius:1px;background:var(--line-strong);min-height:2px}
.rail .sg::before{content:"";position:absolute;left:-3px;top:0;bottom:0;width:2px;background:var(--fam)}
.rail .sg.st-red{background:var(--red)} .rail .sg.st-amber{background:var(--amber)} .rail .sg.st-under{background:var(--under)} .rail .sg.st-ok{background:var(--ok);opacity:.55} .rail .sg.st-empty{background:var(--faint)}
.rail-view{position:absolute;left:-3px;right:-3px;border:2px solid var(--ink);border-radius:4px;pointer-events:none;min-height:6px}

/* overview tiles */
.hintline{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.tile{display:grid;gap:4px;align-content:start;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--fam);border-radius:7px;padding:7px 8px 8px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--line-strong)}
.tile.st-red{background:var(--red-soft);border-color:var(--red-line);border-top-color:var(--red)}
.tile.st-amber{background:var(--amber-soft);border-color:var(--amber-line);border-top-color:var(--amber)}
.tile.st-under{border-top-color:var(--under)}
.tile.drop{outline:2px dashed var(--accent);outline-offset:2px}
.tile.hit{box-shadow:0 0 0 2px var(--accent)}
.t-top{display:flex;align-items:center;gap:6px;min-width:0}
.t-top .code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.t-name{font-weight:700;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{font-size:11px;padding:1px 4px}
.t-nums{font-size:11.5px;color:var(--muted)} .t-nums b{color:var(--ink)}
.t-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-fl{color:var(--red);font-family:var(--f-mono)}
.cl.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* zoom dock */
.dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:5px 6px;max-width:calc(100vw - 32px)}
.zb{width:30px;height:30px;border:1px solid var(--line-strong);background:var(--panel-2);border-radius:6px;font-size:17px;line-height:1;padding:0}
.zb:hover{border-color:var(--accent)}
.levels{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.levels button{border:0;background:var(--panel);padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.levels button+button{border-left:1px solid var(--line)}
.levels button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.size{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding-left:4px}
.size input{width:96px;accent-color:var(--accent)}
.size output{font-family:var(--f-mono);min-width:3.2em}
.where{font-size:12px;color:var(--muted);padding:0 4px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where b{color:var(--ink)}
@media (max-width:720px){.size{display:none}.where{max-width:100%}}

/* family + cluster */
.fam{display:grid;gap:6px;margin-bottom:18px}
.fam-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:2px 2px 4px;border-bottom:2px solid var(--fam)}
.fam-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fam)}
.fam-h span{font-size:12.5px;color:var(--muted)}
.f1{--fam:var(--fam-1)} .f2{--fam:var(--fam-2)} .f3{--fam:var(--fam-3)} .f4{--fam:var(--fam-4)}
.cl{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--fam);border-radius:8px;min-width:0}
.cl.st-red{border-color:var(--red-line);border-left-color:var(--red)}
.cl.st-amber{border-left-color:var(--amber)}
.cl-head{border-radius:0 7px 7px 0}
.cl.open>.cl-head{border-bottom-right-radius:0}
.cl.st-red>.cl-head{background:var(--red-soft)}
.cl.st-amber>.cl-head{background:var(--amber-soft)}
.cl.drop{outline:2px dashed var(--accent);outline-offset:2px}
.cl-head{display:grid;grid-template-columns:2.2rem minmax(0,1.3fr) minmax(90px,1fr) 9.5rem 4.6rem minmax(0,auto) 1rem;gap:10px;align-items:center;padding:8px 10px;min-height:44px;cursor:pointer;user-select:none}
.cl-head .code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cl-name{min-width:0}
.cl-name b{font-size:14.5px}
.cl-name small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar .fill.add{background:var(--nat);opacity:.9}
.bar .one{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:var(--ink);opacity:.55}
.st-red .bar .fill:not(.add){background:var(--red)} .st-amber .bar .fill:not(.add){background:var(--amber)} .st-under .bar .fill:not(.add){background:var(--under)}
.nums{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.nums b{color:var(--ink);font-size:13px}
.badge{font-family:var(--f-mono);font-size:12px;font-weight:500;text-align:center;border-radius:4px;padding:2px 4px;background:var(--ok-soft);color:var(--ok)}
.badge.b-red{background:var(--red);color:var(--panel)} .badge.b-amber{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber-line)}
.badge.b-under{background:var(--under-soft);color:var(--under)} .badge.b-empty{background:var(--panel-2);color:var(--muted);font-family:var(--f-ui);font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;min-width:0}
.caret{color:var(--faint);transition:transform .15s;font-size:11px}
.cl.open .caret{transform:rotate(90deg)}
.fchip{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:1px 5px;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);cursor:pointer;line-height:1.4}
.fchip.res{border-color:var(--line);background:var(--panel-2);color:var(--faint);text-decoration:line-through}
.cl-body{border-top:1px solid var(--line);padding:10px 10px 12px;display:grid;gap:10px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
.langs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.lchip{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--panel-2);border-radius:4px;padding:1px 5px;color:var(--ink)}
.note-info{font-size:12.5px;color:var(--under);background:var(--under-soft);border-radius:5px;padding:5px 8px}
.cl-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.cl-foot textarea{flex:1 1 240px;min-width:0;min-height:34px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px;resize:vertical;font-size:13px}

/* items */
.tree{display:grid;gap:4px}
.kids{margin-left:22px;padding-left:10px;border-left:2px solid var(--line);display:grid;gap:4px;margin-top:4px}
.item{display:grid;grid-template-columns:12px 2.4rem minmax(0,1fr) 7.2rem auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:6px 8px;min-width:0}
.item[draggable="true"]{cursor:grab}
.item.dragging{opacity:.45}
.item.drop{outline:2px dashed var(--accent);outline-offset:1px;background:var(--accent-soft)}
.item.nocount{background:var(--panel-2)}
.item.nocount .pop{color:var(--muted)}
.item.hit{box-shadow:inset 3px 0 0 var(--accent)}
.item.changed{border-color:var(--accent)}
.grip{color:var(--faint);font-size:12px;line-height:1;letter-spacing:-2px}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-align:center;border-radius:4px;padding:2px 0}
.k-jp .kind{background:var(--accent-soft);color:var(--accent)}
.k-nathan .kind{background:var(--nat-soft);color:var(--nat)}
.k-new .kind{background:var(--new-soft);color:var(--new)}
.main{min-width:0}
.l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 7px}
.nm{font-weight:600}
.ref{font-size:11.5px;color:var(--muted)}
.iso{font-family:var(--f-mono);font-size:11px;border-radius:4px;padding:0 4px;border:1px solid var(--line);color:var(--muted)}
.iso.warn{border-color:var(--under);color:var(--under);background:var(--under-soft)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.p-subgroup{background:var(--accent-soft);color:var(--accent)}
.p-alt{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-strong)}
.p-match{background:var(--panel-2);color:var(--muted);border:1px dashed var(--line-strong)}
.p-add{background:var(--nat-soft);color:var(--nat)}
.p-new{background:var(--new-soft);color:var(--new)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.l2{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.int{display:none;font-size:12px;color:var(--amber);font-style:italic;margin-top:2px;overflow-wrap:anywhere}
body.show-int .int{display:block}
.int-tag{font-style:normal;font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.pop{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:4px 6px;text-align:right;font-family:var(--f-mono);font-size:12.5px}
.pop:hover{border-color:var(--line-strong)}
.item .acts{display:flex;gap:4px}
.addbtn{border:1px dashed var(--line-strong);background:transparent;border-radius:6px;padding:6px 10px;color:var(--muted);font-size:13px}
.addbtn:hover{color:var(--accent);border-color:var(--accent)}
@media (max-width:640px){
  .cl-head{grid-template-columns:2rem minmax(0,1fr) 4.4rem 1rem;grid-template-areas:"code name badge caret" "bar bar bar bar" "nums nums chips chips";row-gap:6px}
  .cl-head .nums{text-align:left}
  .cl-head .code{grid-area:code}.cl-name{grid-area:name}.bar{grid-area:bar}.nums{grid-area:nums}.badge{grid-area:badge}.chips{grid-area:chips;justify-content:flex-start}.caret{grid-area:caret}
  .item{grid-template-columns:2.2rem minmax(0,1fr) 5.6rem;grid-template-areas:"kind main main" "pop pop acts"}
  .item .grip{display:none}.item .kind{grid-area:kind}.item .main{grid-area:main}.item .popw{grid-area:pop}.item .acts{grid-area:acts;justify-content:flex-end}
  .kids{margin-left:8px}
  .banks .item{grid-template-columns:2.2rem minmax(0,1fr) 5.6rem}
  .banks .item .acts{grid-column:auto}
}

/* banks */
.tabs{display:flex;border-bottom:1px solid var(--line);padding:6px 6px 0;gap:2px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 10px;border-radius:6px 6px 0 0;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tab b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bank-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.tabbody{overflow:auto;padding:8px 10px 14px;display:grid;gap:6px;align-content:start;min-height:120px}
.tabbody.drop{outline:2px dashed var(--accent);outline-offset:-6px;background:var(--accent-soft)}
.grp-h{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 0;display:flex;gap:6px;align-items:baseline;letter-spacing:.02em}
.grp-h span{font-family:var(--f-mono);font-weight:500}
.banks .item{grid-template-columns:12px 2.2rem minmax(0,1fr) 5.4rem}
.banks .item .acts{grid-column:3/5;justify-content:flex-start}
.sug{font-size:12px;color:var(--ink)}
.sug i{color:var(--muted);font-style:normal}
.hint{font-size:12px;color:var(--ink);background:var(--amber-soft);border-radius:4px;padding:2px 6px;margin-top:3px}
.ref-list{font-size:12.5px;color:var(--muted);display:grid;gap:4px;margin-top:6px}
.ref-list h4{margin:8px 0 2px;color:var(--ink);font-size:12.5px}
.empty{color:var(--muted);font-size:13px;padding:14px 4px}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,18,16,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.dialog{background:var(--panel);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);width:min(720px,100%);display:grid;gap:12px;padding:16px 18px 18px;min-width:0}
.dialog h3{margin:0;font-size:17px;text-wrap:balance}
.dialog .x{justify-self:end}
.d-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form label,.form fieldset{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line-strong);background:var(--panel-2);border-radius:6px;padding:6px 8px;color:var(--ink);min-width:0;width:100%}
.form fieldset{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form legend{padding:0 4px}
.radios{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink);font-size:13px}
.radios label{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-size:13px}
.radios input{width:auto}
.info{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:12.5px;overflow-wrap:anywhere}
.info dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.info dd{margin:0;color:var(--ink)}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.d-actions .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.choice{display:grid;gap:8px}
.choice button{text-align:left;border:1px solid var(--line-strong);background:var(--panel-2);border-radius:8px;padding:10px 12px}
.choice button:hover{border-color:var(--accent)}
.choice button b{display:block;font-size:14px}
.choice button span{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow:auto;max-height:50vh;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel-2);font-weight:600;white-space:nowrap}
td.num{text-align:right;font-family:var(--f-mono)}
.members{display:grid;gap:4px}
.members button{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:6px 8px;text-align:left;font-size:12.5px}
.members button span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

</header>

</div>
<div class="dock" id="dock" role="toolbar" aria-label="Zoom">
  <button class="zb" id="zOut" type="button" title="Zoom out (key: -)" aria-label="Zoom out">&minus;</button>
  <div class="levels" role="group" aria-label="Zoom level"><button type="button" data-level="0" title="All 50 groups on one screen">Overview</button><button type="button" data-level="1" title="One row per census group">Groups</button><button type="button" data-level="2" title="Every record in every group">Records</button></div>
  <button class="zb" id="zIn" type="button" title="Zoom in (key: +)" aria-label="Zoom in">+</button>
  <label class="size" for="zSize">Size<input id="zSize" type="range" min="50" max="150" step="5" value="100"><output id="zSizeOut" for="zSize">100%</output></label>
  <button class="btn small" id="closeAll" type="button" hidden>Close all</button>
  <span class="where" id="where" aria-live="off"></span>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="loadFile" accept=".json,application/json" hidden>

function index(){
  const kids=new Map(), top=new Map();
  for(const id in S.it){ const s=S.it[id];

}
function desc(id,IX){ IX=IX||index(); const out=new Set(); (function w(x){(IX.kids.get(x)||[]).forEach(k=>{out.add(k);w(k);});})(id); return out; }
function inHome(h,IX){ const out=[]; (function w(list){list.forEach(id=>{out.push(id); w(IX.kids.get(id)||[]);});})(IX.top.get(String(h))||[]); return out; }

function activeFlags(code,IX){
  return FLAGS.filter(f=>!S.flagRes[f.id] && f.members.some(m=>S.it[m] && S.it[m].home===code));
}
function stats(code,IX){
  const c=CEN.get(code), proj=c.p2025*factor();
  let jp=0, add=0, nJ=0, nA=0;
  (IX.top.get(String(code))||[]).forEach(id=>{ const s=S.it[id]; if(s.role!=='record') return; const p=+s.pop||0;
    if(meta(id).kind==='jp'){jp+=p;nJ++;} else {add+=p;nA++;} });
  const total=jp+add, ratio=proj?total/proj:0, R=S.rules;
  const st= total===0?'empty': ratio>R.red?'red': ratio>R.amber?'amber': ratio<R.under?'under':'ok';
  const fl=activeFlags(code,IX);
  const red = st==='red'||fl.length>0;
  return {proj,jp,add,total,ratio,st,fl,red,nJ,nA,show: red?'red':st};
}
function diff(id){
  const b=BASE.get(id), s=S.it[id];
  if(!b) return ['New group'];
  const out=[];
  if(b.home!==s.home) out.push('Placement');
  if(b.role!==s.role||(b.parent||null)!==(s.parent||null)) out.push('Role');
  if((b.pop===undefined?null:b.pop)!==s.pop) out.push('Population');
  if(b.name!==s.name) out.push('Name');
  if((b.iso||'')!==(s.iso||'')) out.push('Language');
  if(s.note) out.push('Note');
  return out;
}

/* ---------- persistence ---------- */
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function hydrate(obj){
  const base=fresh();
  if(obj && obj.it){ for(const id in obj.it){ if(base.it[id]||(obj.added&&obj.added[id])) base.it[id]=Object.assign(base.it[id]||{}, obj.it[id]); } }
  base.added=obj.added||{}; base.flagRes=obj.flagRes||{}; base.cnote=obj.cnote||{}; base.events=obj.events||[]; base.seq=obj.seq||1;
  if(obj.rules) Object.assign(base.rules,obj.rules);
  for(const id in base.it){ if(!BASE.has(id)&&!base.added[id]) delete base.it[id]; }
  return base;
}
function snap(){ undo.push(JSON.stringify(S)); if(undo.length>200) undo.shift(); }
function log(act,id,detail){ const m=id?meta(id):null; S.events.push({t:new Date().toISOString(),act,id:id||'',ref:m?m.ref:'',name:id?(S.it[id]?S.it[id].name:m.name):'',detail:detail||''}); }
function commit(msg){ persist(); render(); if(msg) toast(msg); }

/* ---------- mutations ---------- */
function setHomeDeep(id,home,IX){ S.it[id].home=home; (IX.kids.get(id)||[]).forEach(k=>setHomeDeep(k,home,IX)); }
function place(id,home,role,parent){
  const IX=index(), s=S.it[id], kind=meta(id).kind;
  const before={home:s.home,role:s.role,parent:s.parent};
  if(role==='subgroup'||role==='alt'||role==='match'){
    if(!parent||parent===id||desc(id,IX).has(parent)||!S.it[parent]) return false;
    home=S.it[parent].home;
  } else parent=null;
  if(home==='BANK'){ if(kind==='nathan'){role='bank';parent=null;} else {home='U';role='record';} }
  if(role==='bank'&&home!=='BANK') role='record';
  const kids=IX.kids.get(id)||[];
  if(role!=='record'&&kids.length){
    kids.forEach(k=>{ if(role==='bank'){ const nk=meta(k).kind==='nathan'; S.it[k].parent=null; S.it[k].role=nk?'bank':'record'; setHomeDeep(k,nk?'BANK':'U',IX); }
      else { S.it[k].parent=parent; } });
  }
  s.role=role; s.parent=parent; setHomeDeep(id,home,index());
  if(role!=='record'&&role!=='bank'&&kids.length&&role!=='bank'){ const IX2=index(); kids.forEach(k=>setHomeDeep(k,home,IX2)); }
  const desc1=homeLabel(before.home)+', '+ROLE[before.role]+(before.parent?' of '+label(before.parent):'');
  const desc2=homeLabel(home)+', '+ROLE[role]+(parent?' of '+label(parent):'');
  if(desc1!==desc2) log(before.home!==home?'Moved':'Role changed',id,desc1+' > '+desc2);
  if(kids.length&&role!=='record') log('Children re-homed',id,kids.length+' linked item(s) moved with it');
  return true;
}
function setPop(id,v){ const s=S.it[id], old=s.pop; if(old===v) return false; s.pop=v; log('Population',id,(old==null?'blank':fmt(old))+' > '+(v==null?'blank':fmt(v))); return true; }

/* ---------- render ---------- */
function render(){
  const IX=index(); ui.IX=IX;
  const all=CODES.map(c=>[c,stats(c,IX)]);
  renderSummary(all,IX); renderMosaic(all,IX); renderBanks(IX);
  $('#undo').disabled=!undo.length;
  document.body.classList.toggle('show-int',$('#showInt').checked);
  applyView(); queueRail();
}
function changedIds(){ return Object.keys(S.it).filter(id=>diff(id).length); }

    `<span class="sum info" title="Nathan groups and new groups placed as separate records"><b>${nAdd}</b><span>proposed adds, ${fmt(pAdd)} people</span></span>`;
}
function itemHit(id,q){ const m=meta(id), s=S.it[id]; return [s.name,m.ref,s.iso,m.hist,m.lao,m.lang,m.loc,m.rop3].some(v=>v&&String(v).toLowerCase().includes(q)); }
function clusterVisible(code,st,IX){
  const f=ui.filter, q=ui.q;
  if(f==='red'&&!st.red) return false;
  if(f==='amber'&&st.show!=='amber') return false;
  if(f==='under'&&st.show!=='under') return false;
  if(f==='empty'&&st.st!=='empty') return false;
  if(f==='changed'&&!inHome(code,IX).some(id=>diff(id).length)) return false;
  if(!q) return true;
  const c=CEN.get(code);
  if((c.name+' '+c.alt+' '+code+' '+c.langs.join(' ')).toLowerCase().includes(q)) return true;
  return inHome(code,IX).some(id=>itemHit(id,q));
}
function tile(code,st,IX,q){
  const c=CEN.get(code);
  const chg=inHome(code,IX).some(id=>diff(id).length);
  const hit=q&&inHome(code,IX).some(id=>itemHit(id,q));
  const scale=2, wTot=Math.min(st.ratio/scale,1)*100, wJp=Math.min((st.jp/(st.proj||1))/scale,1)*100;
  const badge=st.st==='empty'?'<span class="badge b-empty">none</span>':`<span class="badge b-${st.show==='red'?'red':st.show}">×${ratioTxt(st.ratio)}</span>`;
  const fl=st.fl.map(f=>f.id).join(' ');
  return `<div class="tile st-${st.show}${hit?' hit':''}" data-zone="c:${code}" data-goto="${code}" role="button" tabindex="0" title="${esc(code+' '+c.name+': records '+fmt(st.total)+' vs projected '+fmt(st.proj)+'. Click to zoom in.')}">
    <div class="t-top"><span class="code">${code}</span><span class="t-name">${esc(c.name)}</span>${chg?'<span class="cdot" title="Changed in this session"></span>':''}${badge}</div>
    <span class="bar"><span class="fill add" style="width:${wTot}%"></span><span class="fill" style="width:${wJp}%"></span><span class="one"></span></span>
    <div class="t-nums mono"><b>${fmtK(st.total)}</b> / ${fmtK(st.proj)}</div>
    <div class="t-sub">${st.nJ} JP${st.nA?` · <span style="color:var(--nat)">${st.nA} add${st.nA>1?'s':''}</span>`:''}${fl?` · <span class="t-fl">${esc(fl)}</span>`:''}</div>
  </div>`;
}
function renderOverview(all,IX){
  const S2=new Map(all), q=ui.q; let html='<p class="hintline">All 50 census groups. Click a group to zoom in. Drag from the banks onto a tile to place a group.</p>';
  FAMS.forEach(fam=>{
    const codes=DATA.census.filter(c=>c.family===fam).map(c=>c.code).sort((a,b)=>a-b);
    const vis=codes.filter(c=>clusterVisible(c,S2.get(c),IX));
    if(!vis.length) return;
    let cen=0,pr=0,tot=0; codes.forEach(c=>{cen+=CEN.get(c).p2025;pr+=S2.get(c).proj;tot+=S2.get(c).total;});
    html+=`<section class="fam f${FAMN[fam]}"><div class="fam-h"><h2>${esc(fam)}</h2><span>${codes.length} groups · projected ${fmt(pr)} · in records ${fmt(tot)} (${ratioTxt(pr?tot/pr:0)})</span></div><div class="tiles">${vis.map(c=>tile(c,S2.get(c),IX,q)).join('')}</div></section>`;
  });
  $('#mosaic').innerHTML=html.includes('class="fam')?html:'<p class="empty">No census group matches this search or filter.</p>';
}
function renderMosaic(all,IX){
  if(ui.level===0){ renderOverview(all,IX); return; }
  const S2=new Map(all); let html='';
  const q=ui.q;
  FAMS.forEach(fam=>{
    const codes=DATA.census.filter(c=>c.family===fam).map(c=>c.code).sort((a,b)=>a-b);
    const vis=codes.filter(c=>clusterVisible(c,S2.get(c),IX));
    if(!vis.length) return;
    let cen=0,pr=0,tot=0; codes.forEach(c=>{cen+=CEN.get(c).p2025;pr+=S2.get(c).proj;tot+=S2.get(c).total;});
    html+=`<section class="fam f${FAMN[fam]}"><div class="fam-h"><h2>${esc(fam)}</h2><span>${codes.length} census groups · census 2025 ${fmt(cen)} · projected ${fmt(pr)} · in records ${fmt(tot)} (${ratioTxt(pr?tot/pr:0)})</span></div>`;
    vis.forEach(code=>{ html+=clusterCard(code,S2.get(code),IX, !!q && inHome(code,IX).some(id=>itemHit(id,q))); });
    html+='</section>';
  });
  if(!html) html='<p class="empty">No census group matches this search or filter.</p>';
  $('#mosaic').innerHTML=html;
}
function clusterCard(code,st,IX,autoOpen){
  const c=CEN.get(code), open=ui.level===2||ui.open.has(code)||autoOpen;
  const scale=2; const wTot=Math.min(st.ratio/scale,1)*100, wJp=Math.min((st.jp/(st.proj||1))/scale,1)*100;

function clusterBody(code,st,IX){
  const c=CEN.get(code);
  const langs=c.langs.map(i=>`<span class="lchip" title="${esc((DATA.langs[i]||{}).name||'')}">${i} ${esc((DATA.langs[i]||{}).name||'')}</span>`).join(' ')||'<span>none placed</span>';

  const isoCount={}; tops.forEach(id=>{const s=S.it[id]; if(s.role==='record'&&s.iso&&s.iso!=='xxx') isoCount[s.iso]=(isoCount[s.iso]||0)+1;});

   <div class="langs"><span>Ethnologue languages:</span> ${langs}</div>`;
  if(shared.length) h+=`<div class="note-info">Same census group and language: ${esc(shared.join(', '))}. Subgroup or duplicate candidates unless barrier evidence is on file.</div>`;
  if(st.st==='red') h+=`<div class="note-info" style="color:var(--red);background:var(--red-soft)">Records are ${ratioTxt(st.ratio)}× the projection (red above ${ratioTxt(R.red)}×). Additions must name their source record and reconcile the whole group.</div>`;
  if(allFl.length) h+=`<div class="langs"><span>Flags:</span> ${allFl.map(f=>`<button type="button" class="fchip${S.flagRes[f.id]?' res':''}" data-flag="${f.id}">${f.id} ${esc(f.title)}</button>`).join(' ')}</div>`;

   <div class="cl-foot"><button type="button" class="addbtn" data-add="${code}">+ Add group</button>
   <label class="sr" for="cn-${code}">Group note</label><textarea id="cn-${code}" data-cnote="${code}" placeholder="Meeting note for ${esc(c.name)}">${esc(S.cnote[code]||'')}</textarea></div></div>`;
  return h;
}
function itemRow(id,IX,bank){

  const ch=diff(id);
  let sub='';

  else if(m.kind==='nathan') sub=[m.loc,m.batches?'Lists: '+m.batches:''].filter(Boolean).map(esc).join(' · ');
  else sub='Added in meeting';
  let extra='';
  if(bank&&m.kind==='nathan'){
    const sp=m.sugParent&&S.it[m.sugParent]?`under ${esc(label(m.sugParent))}`:'';

    <div class="main"><div class="l1"><span class="nm">${esc(s.name)}</span><span class="ref mono">${esc(m.ref)}</span>${iso}${pill}${fl}${ch.length?`<span class="cdot" title="Changed: ${esc(ch.join(', '))}"></span>`:''}</div>
      ${sub?`<div class="l2">${sub}</div>`:''}${pub?`<div class="l2">${esc(pub)}</div>`:''}${extra}${note}${intl?`<div class="int"><span class="int-tag">Internal</span>${esc(intl)}</div>`:''}</div>
    <label class="popw"><span class="sr">Population of ${esc(s.name)}</span><input class="pop" type="number" min="0" step="1" inputmode="numeric" data-pop="${esc(id)}" value="${s.pop==null?'':s.pop}" placeholder="${esc(m.popText||'pop.')}" title="${counts?'Counts toward the census group':'Does not count (not a separate record in the 50)'}"></label>

}

/* ---------- drag and drop ---------- */
let dragId=null, hlEl=null;
function hl(el){ if(hlEl===el) return; if(hlEl) hlEl.classList.remove('drop'); hlEl=el; if(el) el.classList.add('drop'); }
function dropTarget(node){
  if(node&&node.nodeType===3) node=node.parentElement;
  if(!node||!node.closest) return null;
  const row=node.closest('.item[data-target]');
  if(row&&row.dataset.id!==dragId&&row.closest('[data-zone]')){ const IX=index(); if(!desc(dragId,IX).has(row.dataset.id)) return {type:'item',id:row.dataset.id,el:row}; }
  const z=node.closest('[data-zone]'); return z?{type:'zone',zone:z.dataset.zone,el:z}:null;
}
document.addEventListener('dragstart',e=>{ const el=e.target.closest&&e.target.closest('.item[draggable]'); if(!el) return; dragId=el.dataset.id; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId);}catch(_){} el.classList.add('dragging'); });
document.addEventListener('dragend',()=>{ dragId=null; hl(null); document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging')); });
document.addEventListener('dragover',e=>{ if(!dragId) return; const t=dropTarget(e.target); if(!t){hl(null);return;} e.preventDefault(); e.dataTransfer.dropEffect='move'; hl(t.el); });
document.addEventListener('drop',e=>{ if(!dragId) return; const t=dropTarget(e.target); if(!t) return; e.preventDefault(); const id=dragId; dragId=null; hl(null); onDrop(id,t); });
function onDrop(id,t){
  const s=S.it[id];
  if(t.type==='item'){
    const p=t.id, ps=S.it[p];
    openModal(`<div class="d-head"><h3>${esc(s.name)} onto ${esc(ps.name)}</h3><button class="btn small x" data-close type="button">Close</button></div>
      <div class="choice">
        <button type="button" data-r="subgroup"><b>Subgroup (PID4) of ${esc(ps.name)}</b><span>Keeps the name as a PeopleID4 under ${esc(meta(p).ref)}. Its population no longer counts separately.</span></button>
        <button type="button" data-r="alt"><b>Alternate name of ${esc(ps.name)}</b><span>Same people. The name is recorded on ${esc(meta(p).ref)}; its population no longer counts.</span></button>
        <button type="button" data-r="record"><b>Separate record in ${esc(homeLabel(ps.home))}</b><span>A peer of ${esc(ps.name)}. Its population adds to the census group total.</span></button>
      </div><div class="d-actions"><button type="button" class="btn" data-close>Cancel</button></div>`,
    ov=>ov.querySelectorAll('[data-r]').forEach(b=>b.addEventListener('click',()=>{ const r=b.dataset.r; snap();
      const ok=place(id,ps.home,r,r==='record'?null:p); closeModal(); if(ok){ if(isCode(ps.home)) ui.open.add(ps.home); commit(s.name+': '+ROLE[r]+(r==='record'?' in '+homeLabel(ps.home):' of '+ps.name)); } else { undo.pop(); toast('That placement would loop a record under itself.'); } })));
    return;
  }
  const z=t.zone; let home=z.startsWith('c:')?+z.slice(2):z;
  if(s.home===home&&(s.role==='record'||s.role==='bank')&&!s.parent) return;
  snap(); place(id,home,home==='BANK'?'bank':'record',null); if(isCode(home)) ui.open.add(home);
  commit('Moved '+s.name+' to '+homeLabel(S.it[id].home));
}

function changesModal(){
  const rows=netRows(), ev=S.events.slice().reverse();
  const tbl=rows.length>1?`<div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Kind</th><th>ID</th><th>Placement</th><th>Role</th><th class="num">Pop.</th><th>Changes</th></tr></thead><tbody>${rows.slice(1).map(r=>`<tr><td>${esc(r[4])}</td><td>${esc(r[1])}</td><td class="mono">${esc(r[2])}</td><td>${esc(r[5]===r[6]?r[6]:(r[5]?r[5]+' > ':'')+r[6])}</td><td>${esc(r[7]===r[8]&&r[9]===r[10]?r[8]:(r[7]?r[7]+' > ':'')+r[8]+(r[10]?' of '+r[10]:''))}</td><td class="num">${esc(r[11]===r[12]?fmt(r[12]):(r[11]===''?'':fmt(r[11])+' > ')+fmt(r[12]))}</td><td>${esc(r[15])}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">No changes yet. Drag groups, edit populations, or resolve flags.</p>';
  const evl=ev.length?`<div class="tbl-wrap" style="max-height:30vh"><table><thead><tr><th>Time</th><th>Action</th><th>Item</th><th>Detail</th></tr></thead><tbody>${ev.map(e=>`<tr><td class="mono">${esc(e.t.slice(11,19))}</td><td>${esc(e.act)}</td><td>${esc(e.name)} <span class="mono">${esc(e.ref)}</span></td><td>${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`:'';
  const fr=Object.keys(S.flagRes).length;
  openModal(`<div class="d-head"><div><h3>Changes this session</h3><div class="l2">${rows.length-1} item(s) changed · ${S.events.length} action(s) logged · ${fr} flag(s) resolved</div></div><button class="btn small x" data-close type="button">Close</button></div>
    ${tbl}${evl?'<h3 style="font-size:14px">Action log</h3>'+evl:''}
    <div class="d-actions"><div class="left"><button type="button" class="btn small" id="mLoad">Load session file</button><button type="button" class="btn small danger" id="mReset">Start over</button></div>
      <button type="button" class="btn" id="mJson">Save session (.json)</button><button type="button" class="btn" id="mCsv">Change log (.csv)</button><button type="button" class="btn primary" id="mXlsx"${window.XLSX?'':' disabled title="Excel library not loaded"'}>Excel workbook (.xlsx)</button></div>`,
  ov=>{
    ov.querySelector('#mCsv').addEventListener('click',exportCsv);
    ov.querySelector('#mJson').addEventListener('click',exportJson);
    ov.querySelector('#mXlsx').addEventListener('click',exportXlsx);
    ov.querySelector('#mLoad').addEventListener('click',()=>$('#loadFile').click());
    const r=ov.querySelector('#mReset'); r.addEventListener('click',()=>{ if(r.dataset.arm!=='1'){ r.dataset.arm='1'; r.textContent='Click again: discard all changes'; return; } snap(); S=fresh(); closeModal(); commit('Started over. Undo restores the previous state.'); });
  });
}
$('#loadFile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const o=JSON.parse(rd.result); if(!o||o.tool!=='laos-mosaic-workbench'||!o.state) throw new Error('not a session file'); snap(); S=hydrate(o.state); log('Session loaded','',f.name); closeModal(); commit('Loaded '+f.name); }
    catch(err){ toast('That file is not a Laos Mosaic session file.'); } e.target.value=''; };
  rd.readAsText(f); });

/* ---------- rules ---------- */
function renderRules(){
  const R=S.rules;
  $('#rulesPop').innerHTML=`<label for="rRed">Red above (× projection)<input id="rRed" type="number" step="0.05" min="1" value="${R.red}"></label>
    <label for="rAmber">Amber above (× projection)<input id="rAmber" type="number" step="0.05" min="1" value="${R.amber}"></label>
    <label for="rUnder">Under below (× projection)<input id="rUnder" type="number" step="0.05" min="0" max="1" value="${R.under}"></label>
    <label for="rUn">UN population 2026<input id="rUn" type="number" step="1000" value="${R.un}"></label>
    <label for="rCen">2025 census enumerated total<input id="rCen" type="number" step="100" value="${R.cen}"></label>
    <p>Projection factor <span class="mono">${(R.un/R.cen).toFixed(4)}</span>. Projected 2026 = census 2025 × factor. A census group is also red when it holds an open duplicate or alt-name flag.</p>
    <div class="legend"><span><i class="sw" style="background:var(--red)"></i>Red</span><span><i class="sw" style="background:var(--amber)"></i>Amber</span><span><i class="sw" style="background:var(--under)"></i>Under</span><span><i class="sw" style="background:var(--nat)"></i>Proposed adds in bar</span></div>`;
  [['rRed','red'],['rAmber','amber'],['rUnder','under'],['rUn','un'],['rCen','cen']].forEach(([el,k])=>$('#'+el).addEventListener('change',e=>{ const v=+e.target.value; if(!(v>0)) return; snap(); log('Rules','',k+': '+S.rules[k]+' > '+v); S.rules[k]=v; persist(); render(); renderRules(); }));
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  const fl=t.closest('[data-flag]'); if(fl){ e.stopPropagation(); flagModal(fl.dataset.flag); return; }
  const lv=t.closest('[data-level]'); if(lv){ setLevel(+lv.dataset.level); return; }
  const go=t.closest('[data-goto]'); if(go){ zoomTo(+go.dataset.goto); return; }
  const ed=t.closest('[data-edit]'); if(ed&&!t.closest('#ov')){ editor(ed.dataset.edit); return; }
  const pl=t.closest('[data-place]'); if(pl){ editor(pl.dataset.place,true); return; }
  const ad=t.closest('[data-add]'); if(ad){ addGroup(+ad.dataset.add); return; }
  const tb=t.closest('[data-tab]'); if(tb){ ui.tab=tb.dataset.tab; renderBanks(ui.IX||index()); return; }
  const sf=t.closest('[data-filter]'); if(sf){ ui.filter=(ui.filter===sf.dataset.filter&&sf.dataset.filter!=='all')?'all':sf.dataset.filter; render(); return; }
  const tg=t.closest('[data-toggle]'); if(tg&&!t.closest('input,textarea,button')){ const c=+tg.dataset.toggle; ui.open.has(c)?ui.open.delete(c):ui.open.add(c); render(); return; }
});
document.addEventListener('keydown',e=>{ const tg=e.target.closest&&e.target.closest('[data-toggle]'); if(tg&&(e.key==='Enter'||e.key===' ')&&e.target===tg){ e.preventDefault(); const c=+tg.dataset.toggle; ui.open.has(c)?ui.open.delete(c):ui.open.add(c); render(); const n=document.querySelector(`[data-toggle="${c}"]`); if(n) n.focus(); } });
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pop){ const id=t.dataset.pop, v=t.value===''?null:Math.max(0,Math.round(+t.value)); snap(); if(setPop(id,v)) commit('Population updated: '+S.it[id].name); else undo.pop(); return; }
  if(t.dataset&&t.dataset.cnote){ const c=+t.dataset.cnote, v=t.value.trim(); if(v===(S.cnote[c]||'')) return; snap(); S.cnote[c]=v; log('Group note','',homeLabel(c)+': '+v); commit(); return; }
  if(t.id==='only26'){ ui.only26=t.checked; renderBanks(ui.IX||index()); return; }
  if(t.id==='showInt'){ document.body.classList.toggle('show-int',t.checked); return; }
});
let qt=null;
$('#q').addEventListener('input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{ ui.q=e.target.value.trim().toLowerCase(); render(); },140); });
/* ---------- zoom, navigator, location ---------- */
function stickPx(){ const t=$('#top'); return getComputedStyle(t).position==='sticky'?t.getBoundingClientRect().height:0; }
function saveView(){ try{ localStorage.setItem(VKEY,JSON.stringify({level:ui.level,scale:ui.scale})); }catch(e){} }
function applyView(){
  const m=$('#mosaic'), s=ui.scale[ui.level]||1;
  m.style.setProperty('--z',s);
  $('#zSize').value=Math.round(s*100); $('#zSizeOut').textContent=Math.round(s*100)+'%';
  document.querySelectorAll('[data-level]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===ui.level)));
  $('#zOut').disabled=ui.level===0&&s<=0.5; $('#zIn').disabled=ui.level===2&&s>=1.5;
  $('#layout').classList.toggle('no-rail',ui.level===0); $('#rail').hidden=ui.level===0;
  $('#closeAll').hidden=!(ui.level===1&&ui.open.size>0);
}
function clusterEls(){ return [...document.querySelectorAll('#mosaic .cl')]; }
function topVisible(){ const st=stickPx(); for(const el of clusterEls()){ const r=el.getBoundingClientRect(); if(r.bottom>st+12) return {code:+el.dataset.code,off:clamp(r.top-st,8,240)}; } return null; }
function scrollToCode(code,off,smooth){
  const el=document.getElementById('cl-'+code); if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-stickPx()-(off==null?10:off);
  const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:Math.max(0,y),behavior:smooth&&!rm?'smooth':'auto'});
}
function fitOverview(){
  if(window.innerWidth<720){ ui.scale[0]=1; applyView(); return; }
  const m=$('#mosaic'), avail=window.innerHeight-stickPx()-96;
  const fits=s=>{ ui.scale[0]=s; applyView(); return m.getBoundingClientRect().height<=avail; };
  let lo=0.5, hi=1;
  if(fits(1)) lo=1; else { for(let i=0;i<7;i++){ const mid=(lo+hi)/2; if(fits(mid)) lo=mid; else hi=mid; } }
  ui.scale[0]=Math.floor(lo*100)/100; applyView();
  window.scrollTo(0,Math.max(0,m.getBoundingClientRect().top+window.scrollY-stickPx()-10));
}
function setLevel(L){
  L=clamp(L,0,2); if(L===ui.level) return;
  const anchor=ui.level>0?topVisible():null;
  ui.level=L; render();
  if(L===0) fitOverview(); else if(anchor) scrollToCode(anchor.code,anchor.off,false); else window.scrollTo(0,0);
  saveView(); queueRail();
}
function zoomTo(code){
  ui.open.add(code); if(ui.level===0) ui.level=1; render(); saveView();
  requestAnimationFrame(()=>{ scrollToCode(code,10,true); const el=document.getElementById('cl-'+code); if(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
}
function zoomAround(s,clientY){
  const m=$('#mosaic'), r=m.getBoundingClientRect(), f=r.height?(clientY-r.top)/r.height:0;
  s=clamp(Math.round(s*100)/100,0.5,1.5); if(s===ui.scale[ui.level]) return;
  ui.scale[ui.level]=s; applyView();
  const r2=m.getBoundingClientRect(); window.scrollBy(0,r2.top+f*r2.height-clientY); queueRail(); saveView();
}
function step(dir){
  const s=ui.scale[ui.level]||1, mid=(stickPx()+window.innerHeight)/2;
  if(dir<0){ if(ui.level>0) setLevel(ui.level-1); else zoomAround(s-0.1,mid); }
  else { if(ui.level<2) setLevel(ui.level+1); else zoomAround(s+0.1,mid); }
}
let railQ=false;
function queueRail(){ if(railQ) return; railQ=true; requestAnimationFrame(()=>{ railQ=false; layoutRail(); updateWhere(); }); }
function layoutRail(){
  const rail=$('#rail'); if(rail.hidden||getComputedStyle(rail).display==='none') return;
  const m=$('#mosaic'), mr=m.getBoundingClientRect(), H=mr.height; if(!H) return;
  $('#railTrack').innerHTML=clusterEls().map(el=>{ const r=el.getBoundingClientRect(); const st=[...el.classList].find(c=>c.startsWith('st-'))||''; const f=[...el.classList].find(c=>/^f\d$/.test(c))||'';
    return `<div class="sg ${st} ${f}" style="top:${((r.top-mr.top)/H*100).toFixed(3)}%;height:${(r.height/H*100).toFixed(3)}%" title="${esc(el.dataset.title||'')}"></div>`; }).join('');
  railView();
}
function railView(){
  const rail=$('#rail'); if(rail.hidden) return;
  const m=$('#mosaic'), mr=m.getBoundingClientRect(), H=mr.height, st=stickPx(); if(!H) return;
  const top=clamp((st-mr.top)/H,0,1), h=clamp((window.innerHeight-st)/H,0.005,1-top);
  const v=$('#railView'); v.style.top=(top*100)+'%'; v.style.height=(h*100)+'%';
}
function railJump(e){
  const tr=$('#railTrack').getBoundingClientRect(), f=clamp((e.clientY-tr.top)/tr.height,0,1);
  const m=$('#mosaic'), mr=m.getBoundingClientRect(), st=stickPx();
  const docY=mr.top+window.scrollY+f*mr.height; window.scrollTo(0,Math.max(0,docY-(st+window.innerHeight)/2));
}
(function(){ const rail=$('#rail'); let drag=false;
  rail.addEventListener('pointerdown',e=>{ drag=true; try{rail.setPointerCapture(e.pointerId);}catch(_){} railJump(e); });
  rail.addEventListener('pointermove',e=>{ if(drag) railJump(e); });
  const end=()=>{drag=false;}; rail.addEventListener('pointerup',end); rail.addEventListener('pointercancel',end);
})();
function updateWhere(){
  const w=$('#where');
  if(ui.level===0){ w.innerHTML='<b>All 50 groups</b>'; return; }
  const t=topVisible(); if(!t){ w.textContent=''; return; }
  const c=CEN.get(t.code), st=stats(t.code,ui.IX||index());
  w.innerHTML=`${esc(c.family)} › <b>${t.code} ${esc(c.name)}</b> ${st.st==='empty'?'no record':'×'+ratioTxt(st.ratio)}`;
}
let scrQ=false;
window.addEventListener('scroll',()=>{ if(scrQ) return; scrQ=true; requestAnimationFrame(()=>{ scrQ=false; railView(); updateWhere(); }); },{passive:true});
window.addEventListener('resize',queueRail);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(queueRail);
$('#mosaic').addEventListener('wheel',e=>{ if(!e.ctrlKey) return; e.preventDefault(); zoomAround((ui.scale[ui.level]||1)*Math.exp(-e.deltaY*0.004),e.clientY); },{passive:false});
$('#zSize').addEventListener('input',e=>zoomAround(+e.target.value/100,(stickPx()+window.innerHeight)/2));
$('#zOut').addEventListener('click',()=>step(-1));
$('#zIn').addEventListener('click',()=>step(1));
$('#closeAll').addEventListener('click',()=>{ ui.open.clear(); render(); });
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||$('#ov')) return;
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return;
  if(e.key==='-'||e.key==='_'){ e.preventDefault(); step(-1); }
  else if(e.key==='='||e.key==='+'){ e.preventDefault(); step(1); }
  else if(e.key==='0'){ e.preventDefault(); if(ui.level===0) fitOverview(); else zoomAround(1,(stickPx()+window.innerHeight)/2); }
  else if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.goto){ e.preventDefault(); zoomTo(+e.target.dataset.goto); }
});
$('#undo').addEventListener('click',()=>{ if(!undo.length) return; S=JSON.parse(undo.pop()); persist(); render(); renderRules(); toast('Undone'); });
$('#changesBtn').addEventListener('click',changesModal);
document.addEventListener('click',e=>{ const d=$('#rules'); if(d.open&&!d.contains(e.target)) d.open=false; });
if(window.ResizeObserver){ new ResizeObserver(()=>document.documentElement.style.setProperty('--hdr',$('#top').offsetHeight+'px')).observe($('#top')); }

/* ---------- boot ---------- */
(function boot(){
  let saved=null; try{ const raw=localStorage.getItem(KEY); if(raw) saved=JSON.parse(raw); }catch(e){ saved=null; }
  if(saved&&saved.events&&saved.events.length){
    try{ S=hydrate(saved); const b=$('#banner'); const last=S.events[S.events.length-1];
      b.innerHTML=`<span>Restored ${changedIds().length} changed item(s) from this browser (last action ${esc(last.t.slice(0,16).replace('T',' '))} UTC).</span><button type="button" class="btn small" id="bFresh">Start fresh</button><button type="button" class="btn small" id="bHide">Keep working</button>`;
      b.hidden=false;
      $('#bFresh').addEventListener('click',ev=>{ const x=ev.currentTarget; if(x.dataset.arm!=='1'){ x.dataset.arm='1'; x.textContent='Click again: discard'; return; } snap(); S=fresh(); persist(); b.hidden=true; render(); renderRules(); toast('Started fresh. Undo restores the previous state.'); });
      $('#bHide').addEventListener('click',()=>{ b.hidden=true; });
    }catch(e){ S=fresh(); }
  }
  try{ const v=JSON.parse(localStorage.getItem(VKEY)||'null'); if(v){ ui.level=clamp(+v.level||0,0,2); if(v.scale) Object.assign(ui.scale,v.scale); } }catch(e){}
  const hasInt=DATA.items.some(i=>(i.int&&i.int!==i.pub)||i.intStatus)||DATA.flags.some(f=>f.int!==f.pub);
  if(!hasInt){ const sw=document.querySelector('label[for="showInt"]'); if(sw) sw.hidden=true; }
  [43].forEach(c=>ui.open.add(c));
  render(); renderRules();
  if(ui.level===0) requestAnimationFrame(fitOverview);
})();
})();
</script>

</body>
